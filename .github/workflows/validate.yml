name: Validate data

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate structured prompt data
        run: python scripts/validate_data.py
      - name: Verify generated README files are current
        run: |
          python scripts/generate_readme.py
          git diff --exit-code README.md README_zh.md

